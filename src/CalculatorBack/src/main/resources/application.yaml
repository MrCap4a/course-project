server:
  servlet:
    context-path: /api/v1

spring:
  application:
    name: Calculator

  datasource:
    url: jdbc:postgresql://localhost:5432/SuperCalculator
    username: postgres
    password: 2212
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        globally_quoted_identifiers: true

security:
  jwt:
    secret: super-calculator-jwt-secret-key-change-before-deploy
    expiration: 86400
    refresh-expiration: 604800
