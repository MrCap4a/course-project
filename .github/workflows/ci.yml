name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ── Backend: compile + test + coverage ──────────────────────────────────────
  backend-test:
    name: Backend — Test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x src/CalculatorBack/gradlew

      - name: Compile
        working-directory: src/CalculatorBack
        run: ./gradlew compileJava compileTestJava --no-daemon

      - name: Run tests
        working-directory: src/CalculatorBack
        run: ./gradlew test --no-daemon

      - name: Generate JaCoCo coverage report
        if: always()
        working-directory: src/CalculatorBack
        run: ./gradlew jacocoTestReport --no-daemon

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: src/CalculatorBack/build/reports/jacoco/test/html/

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: src/CalculatorBack/build/test-results/

  # ── Backend: package JAR (only after tests pass) ────────────────────────────
  backend-package:
    name: Backend — Package JAR
    runs-on: ubuntu-latest
    needs: backend-test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x src/CalculatorBack/gradlew

      - name: Build executable JAR
        working-directory: src/CalculatorBack
        run: ./gradlew bootJar --no-daemon -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: src/CalculatorBack/build/libs/*.jar
          retention-days: 7

  # ── Backend: Docker image ────────────────────────────────────────────────────
  docker-build:
    name: Backend — Docker Image
    runs-on: ubuntu-latest
    needs: backend-test
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on master)
        uses: docker/build-push-action@v5
        with:
          context: src/CalculatorBack
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/supercalculator-backend:latest
            ghcr.io/${{ github.repository_owner }}/supercalculator-backend:${{ github.sha }}

  # ── Desktop: compile JavaFX client ──────────────────────────────────────────
  desktop-build:
    name: Desktop — Compile
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x src/CalculatorDesktop/gradlew

      - name: Compile Desktop
        working-directory: src/CalculatorDesktop
        run: ./gradlew compileJava --no-daemon
